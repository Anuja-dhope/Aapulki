<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>आपुलकी (Aapulki) — Gifts that carry a little love</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="apple-touch-icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F1;--card:#fff;--ink:#3B2238;--mut:#6B5668;--line:#EBDCD3;--blush:#F9DDE0;--peach:#FFD9BF;--coral:#BF4F2C;--on:#fff;--lav:#E6DDF6;--sun:#FBE3A1;--sh:0 4px 16px rgba(59,34,56,.08);--r:16px;
--s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241621;--card:#322130;--ink:#FBEFE6;--mut:#CDB8C6;--line:#4A3647;--blush:#4A2B3A;--peach:#4F3328;--coral:#F08A68;--on:#2A1420;--lav:#3C3157;--sun:#5A4A21;--sh:0 4px 16px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#241621;--card:#322130;--ink:#FBEFE6;--mut:#CDB8C6;--line:#4A3647;--blush:#4A2B3A;--peach:#4F3328;--coral:#F08A68;--on:#2A1420;--lav:#3C3157;--sun:#5A4A21;--sh:0 4px 16px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Nunito,"Segoe UI",system-ui,sans-serif;padding-bottom:96px}
h1,h2,h3{line-height:1.2;margin:0 0 var(--s1);font-weight:800}
h1{font-size:clamp(32px,6vw,52px)}h2{font-size:clamp(24px,4vw,32px)}h3{font-size:18px}
p{margin:0 0 var(--s2)}a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 var(--s2)}
.sec{margin:var(--s6) 0}
.mut{color:var(--mut)}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
.ic{flex:none}.custom-ic{display:inline-block;vertical-align:middle;object-fit:contain;transition:transform .2s ease}
.tile .custom-ic{width:28px!important;height:28px!important}nav.tabs .custom-ic{margin-bottom:2px}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
/* header + nav */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:var(--s2);height:64px}
.brand{display:flex;align-items:center;gap:var(--s1);text-decoration:none}
.mark{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 8px rgba(59,34,56,.08);flex-shrink:0}
.brand-logo-img{width:100%;height:100%;object-fit:contain;display:block}
.brand b{font:700 22px "Noto Sans Devanagari",Nunito,sans-serif}.brand small{color:var(--mut);font-weight:700}
.spacer{flex:1}
.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:40}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:8px 0;border-radius:12px;color:var(--mut);text-decoration:none}
nav.tabs a[aria-current=page]{background:var(--blush);color:var(--ink)}
@media(min-width:820px){body{padding-bottom:0}nav.tabs{position:static;border:0;background:none;padding:0;flex:1;justify-content:center;gap:var(--s1)}nav.tabs a{flex:none;flex-direction:row;gap:var(--s1);font-size:15px;padding:8px 16px}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);min-height:48px;padding:0 var(--s3);border-radius:999px;border:2px solid var(--coral);background:var(--coral);color:var(--on);font:800 16px Nunito,sans-serif;text-decoration:none;cursor:pointer;box-shadow:var(--sh)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--ink);box-shadow:none}
.btn.ghost{background:var(--blush);border-color:transparent;color:var(--ink);box-shadow:none}
.btn.sm{min-height:44px;padding:0 var(--s2);font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* cards, chips */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:var(--s3)}
.grid{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 var(--s2);border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 14px Nunito,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--lav);border-color:var(--ink)}
.tag{display:inline-block;padding:2px 12px;border-radius:999px;font-size:12px;font-weight:800;background:var(--sun);color:var(--ink)}
.tag.l{background:var(--lav)}.tag.b{background:var(--blush)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--peach);margin-bottom:var(--s2)}
/* hero */
.hero{display:grid;gap:var(--s4);align-items:center;margin-top:var(--s4)}
@media(min-width:820px){.hero{grid-template-columns:1.2fr 1fr}}
.art{position:relative;aspect-ratio:1;max-width:360px;width:100%;margin:auto;border-radius:32px;background:linear-gradient(145deg,var(--peach),var(--blush));display:grid;place-items:center;color:var(--coral);overflow:hidden}
.art:before,.art:after{content:"";position:absolute;border-radius:50%}
.art:before{width:45%;aspect-ratio:1;background:var(--lav);top:-8%;right:-6%}.art:after{width:30%;aspect-ratio:1;background:var(--sun);bottom:8%;left:-4%}
.art svg{position:relative;z-index:1}
/* product */
.prod{padding:0;overflow:hidden}
.prod .th{height:140px;display:grid;place-items:center;color:var(--coral);position:relative}
.prod .bd{padding:var(--s2) var(--s3) var(--s3)}
.save{position:absolute;top:var(--s1);right:var(--s1);background:var(--card);color:var(--ink)}
.price{font-weight:800;font-size:18px}
.row{display:flex;align-items:center;gap:var(--s2)}
.date{min-width:64px;text-align:center;background:var(--blush);border-radius:12px;padding:var(--s1);font-weight:800;line-height:1.2}
/* progress */
.steps{display:flex;gap:var(--s1);list-style:none;padding:0;margin:0 0 var(--s3)}
.steps li{flex:1;font-size:12px;font-weight:700;color:var(--mut)}
.steps li:before{content:"";display:block;height:8px;border-radius:99px;background:var(--line);margin-bottom:6px}
.steps li.done:before{background:var(--coral)}.steps li[aria-current=step]{color:var(--ink)}.steps li[aria-current=step]:before{background:var(--coral);opacity:.55}
/* forms */
label{display:block;font-weight:700;margin-bottom:6px}
.in{width:100%;min-height:48px;padding:0 var(--s2);border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:400 16px Nunito,sans-serif}
textarea.in{padding:var(--s1) var(--s2);min-height:96px}
.in.err{border-color:var(--coral)}.help{font-size:13px;color:var(--mut);margin:4px 0 var(--s2)}
.help.e{color:var(--coral);font-weight:700}
/* messages */
.msg{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s2);border-radius:var(--r);margin-bottom:var(--s1);font-weight:600}
.msg.ok{background:var(--lav)}.msg.info{background:var(--peach)}.msg.warn{background:var(--sun)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:60;max-width:92vw;margin:0}
@media(min-width:820px){#toast{bottom:32px}}
dialog{border:0;border-radius:20px;padding:var(--s4);max-width:440px;width:92vw;background:var(--card);color:var(--ink);box-shadow:0 16px 48px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(59,34,56,.5)}
/* footer */
footer{background:var(--blush);margin-top:var(--s6);padding:var(--s4) 0;border-radius:32px 32px 0 0}
footer .cols{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer a{display:block;padding:4px 0;text-decoration:none;font-weight:600}
/* welcome */
.welcome{min-height:100vh;display:grid;place-items:center;text-align:center;padding:var(--s4) var(--s2);position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bg),var(--blush) 60%,var(--peach))}
.welcome .blob{position:absolute;border-radius:50%}
.b1{width:280px;height:280px;background:var(--lav);top:-80px;left:-80px;opacity:.8}.b2{width:220px;height:220px;background:var(--sun);bottom:-60px;right:-40px;opacity:.7}
.wc{position:relative;max-width:420px}
.logo-lg{width:130px;height:130px;margin:0 auto var(--s3);border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(59,34,56,.12);border:1px solid var(--line);padding:10px;overflow:hidden}
.welcome-logo-img{width:100%;height:100%;object-fit:contain;display:block}
.ft-logo{width:52px;height:52px;object-fit:contain;border-radius:14px;background:#fff;padding:4px;border:1px solid var(--line);box-shadow:0 4px 12px rgba(59,34,56,.08);flex-shrink:0}
.welcome h1{font-family:"Noto Sans Devanagari",Nunito,sans-serif;font-size:64px;margin:0}
.welcome .sub{font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.welcome .tg{font-size:20px;margin:var(--s2) 0 var(--s4)}
.swatch,.color-swatch{height:64px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px}
.hide{display:none}

.skip{position:absolute;left:8px;top:-100px;z-index:100;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:800}.skip:focus{top:8px}
.chip[aria-pressed=true]:before{content:"✓"}
nav.tabs a[aria-current=page]{box-shadow:inset 0 0 0 2px var(--ink)}
.lead{font-size:18px}.crumb{font-weight:700}.crumb a{color:var(--coral)}
.seg{position:relative}.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.seg input:checked+span{background:var(--lav);border-color:var(--ink);font-weight:800}.seg input:checked+span:before{content:"✓"}
.seg input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
fieldset.fs{margin:0 0 16px;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);background:var(--card);box-shadow:var(--sh)}fieldset.fs legend{padding:0 8px;font-weight:800}
.tgl{min-height:44px;min-width:88px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:800 15px Nunito,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tgl span{display:inline-flex;align-items:center;gap:6px}.tgl[aria-checked=true]{background:var(--coral);border-color:var(--coral);color:var(--on)}
.card.sw,.card.sw-card,fieldset.card.sw,fieldset.card.sw-card{margin-bottom:16px;height:auto;min-height:auto;box-sizing:border-box}.card.sw .help,.card.sw-card .help{margin:0}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--coral);flex:none;margin-top:6px;animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.6);opacity:.5}}
.skel{height:48px;border-radius:12px;margin-top:8px;background:linear-gradient(90deg,var(--line),var(--blush),var(--line));background-size:200% 100%;animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}
.how{list-style:none;padding:0;margin:0;display:grid;gap:16px}.how li{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;font-weight:800}
.fab{position:fixed;right:16px;bottom:96px;z-index:35;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:92vw}
@media(min-width:820px){.fab{bottom:24px}}
.art svg{width:92%;height:auto}
html[data-size=l] body{zoom:1.15}html[data-size=xl] body,html[data-senior="1"] body{zoom:1.3}
html[data-contrast=high]{--bg:#fff;--card:#fff;--ink:#000;--mut:#1f1f1f;--line:#000;--blush:#FBD5DB;--peach:#FFD0AE;--lav:#D9CCF5;--sun:#FFE08A;--coral:#8F2F10;--on:#fff}
html[data-contrast=high] .card,html[data-contrast=high] .chip,html[data-contrast=high] .in,html[data-contrast=high] .seg span{border-width:2px;border-color:#000}
html[data-contrast=high] :focus-visible{outline:4px solid #000;outline-offset:3px}
html[data-motion=reduce] *,html[data-motion=reduce] *:before{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
html[data-simple="1"] .deco,html[data-simple="1"] .blob,html[data-simple="1"] .tile,html[data-simple="1"] .rich,html[data-simple="1"] #cart,html[data-data="1"] .deco,html[data-data="1"] .blob{display:none}
html[data-simple="1"] .grid,html[data-simple="1"] .hero{grid-template-columns:1fr}
html[data-simple="1"] .welcome,html[data-data="1"] .welcome{background:var(--bg)}
html[data-simple="1"] .prod .th,html[data-data="1"] .prod .th{background:var(--card)!important}
html[data-simple="1"] *,html[data-data="1"] *{box-shadow:none!important}html[data-data="1"] .hdr{backdrop-filter:none}
html[data-senior="1"] .btn{min-height:56px;font-size:18px}html[data-senior="1"] .chip,html[data-senior="1"] .seg span{min-height:52px;font-size:16px}html[data-senior="1"] nav.tabs a{font-size:13px}

.cats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cat{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:700;box-shadow:var(--sh)}
.feat{background:var(--peach)}
.sumc{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;text-decoration:none}
.optg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{position:relative;display:block}.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:8px 16px;text-align:center;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;box-shadow:var(--sh)}
.opt input:checked+span{background:var(--lav);border-color:var(--ink);font-weight:800}.opt input:checked+span:before{content:"✓"}
.opt input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
fieldset.optset{border:0;padding:0;margin:0;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html[data-contrast=high] .opt span,html[data-contrast=high] .cat,html[data-contrast=high] .sumc{border-color:#000}
html[data-senior="1"] .opt span{min-height:72px;font-size:18px}
html[data-simple="1"] .optg{grid-template-columns:1fr}
.tag svg{vertical-align:-2px}
.fc{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 14px Nunito,sans-serif;cursor:pointer}
.fc[aria-pressed=true]{background:var(--lav);border-color:var(--ink);font-weight:800}.fc[aria-pressed=true]:before{content:"✓"}
.rl{list-style:none;padding:0;margin:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rl>li{display:flex}.rc{display:flex;flex-direction:column;width:100%}.rc .th{height:150px}.rc .bd{display:flex;flex-direction:column;flex:1}.rc .cta{margin-top:auto}
.svd{position:absolute;top:8px;left:8px;background:var(--lav);border:1.5px solid var(--ink)}
[data-sv][aria-pressed=true] svg{fill:currentColor}
.ml{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:6px;font-size:14px;font-weight:600}.ml li{display:flex;gap:8px;align-items:flex-start}
.why{background:var(--blush);border-radius:12px;padding:8px 16px;font-size:14px;margin:8px 0 0}
.fp{margin:16px 0}.fg{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.fp select.in{width:100%}
.fp legend{font-weight:800;padding:0}
.pd{display:grid;gap:24px;grid-template-areas:"img" "panel" "det";margin:16px 0 0}
.pd .a1{grid-area:img}.pd .a2{grid-area:panel}.pd .a3{grid-area:det}.pd h2{font-size:22px;margin-top:24px}
@media(min-width:820px){.pd{grid-template-columns:1.1fr 1fr;grid-template-areas:"img panel" "det panel";align-items:start}}
.pimg{aspect-ratio:4/3;border-radius:24px;display:grid;place-items:center;color:var(--coral)}
.pth{position:relative;width:64px;height:64px;border-radius:16px;border:2px solid var(--line);color:var(--coral);display:grid;place-items:center;cursor:pointer}
.pth[aria-pressed=true]{border:4px solid var(--ink)}.pth[aria-pressed=true]:after{content:"✓";position:absolute;right:2px;bottom:-2px;font-weight:800;color:var(--ink);font-size:14px}
.po{margin-bottom:12px;padding:var(--s2)}.po h3{font-size:17px;margin:0}
summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
html[data-contrast=high] .fc,html[data-contrast=high] .pth{border-color:#000}
html[data-simple="1"] .rl{grid-template-columns:1fr}
.ro{position:relative;display:block}.ro input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.ro span{display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;box-shadow:var(--sh)}
.ro input:checked+span{background:var(--lav);border-color:var(--ink);font-weight:800}.ro input:checked+span:before{content:"✓"}.ro input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
.rog{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.fc.wide{width:100%;justify-content:flex-start;text-align:left;height:auto;padding:8px 16px}
.plate{display:inline-flex;flex-direction:column;align-items:center;padding:8px 24px;border-radius:10px;border:2px solid #7A5A1E;background:linear-gradient(135deg,#F1E0A8,#C9A95A);color:#3B2238;font:italic 800 20px Georgia,serif;min-width:120px}.plate small{font:italic 600 13px Georgia,serif}
.gcard{border-radius:20px;padding:24px;border:2px solid var(--ink);min-height:200px;box-shadow:var(--sh);transform:rotate(-1.5deg)}
.gs_warm{background:var(--blush)}.gs_bright{background:var(--sun)}.gs_calm{background:var(--lav)}
.gcard p{margin:0 0 8px;overflow-wrap:anywhere}.gmsg{font-size:18px;font-weight:700;white-space:pre-wrap}.ph{font-style:italic;font-weight:400;color:var(--mut)}.gfr{text-align:right;font-weight:800}.gsn{font-size:13px;margin-left:6px}
.gl,.pvw{display:grid;gap:24px}@media(min-width:820px){.gl,.pvw{grid-template-columns:1fr 1fr;align-items:start}}
.sy{margin:0}.sy div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}.sy dt,.sy dd{margin:0}.sy .tot{font-weight:800;font-size:18px;border:0}
.pvl{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}.pvl li{padding:var(--s2)}
html[data-contrast=high] .ro span{border-color:#000}html[data-senior="1"] .ro span{min-height:72px;font-size:18px}html[data-simple="1"] .rog{grid-template-columns:1fr}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to main content</a>
<header class="hdr" id="hdr"><div class="wrap">
<a class="brand" href="#home" aria-label="आपुलकी Aapulki home"><span class="mark" id="mk"></span><b>आपुलकी</b><small>Aapulki</small></a>
<nav class="tabs" id="nav" aria-label="Main"></nav>
<span class="spacer"></span>
<button class="iconbtn" id="cart" aria-label="Cart"></button>
